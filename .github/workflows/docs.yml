name: docs

# The site is versioned, so what published it decides what it is called. A push to main
# publishes `dev`, which describes the source; a tag publishes that release under its own
# X.Y and moves the `latest` alias onto it, which describes what `pip install` gives you.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Two of these must never interleave: each one commits to the same pages branch, and a
# cancelled deploy would leave that branch half written.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # mike reads and rewrites the pages branch, so it needs the history, not a
          # shallow clone of the tip.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group docs
      - name: Give the deploy commits an author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish the development version
        if: github.ref_type == 'branch'
        run: uv run mike deploy --push --update-aliases dev

      - name: Publish the release
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run mike deploy --push --update-aliases "${version%.*}" latest
          uv run mike set-default --push latest
