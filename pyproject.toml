[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "polars-faer"
description = "Dense numerical operations for Polars, backed by faer."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Bastiaan van Gaalen" }]
keywords = ["polars", "faer", "linear-algebra", "least-squares", "pca"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["polars>=1.34"]
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "polars_faer._internal"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [{ include-group = "lint" }, { include-group = "test" }]
lint = ["mypy>=1.18", "ruff>=0.14"]
test = ["numpy>=2.3", "pytest>=8.4"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["python", "tests"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "EM",    # flake8-errmsg
    "ERA",   # eradicate (commented-out code)
    "F",     # pyflakes
    "FBT",   # flake8-boolean-trap
    "I",     # isort
    "N",     # pep8-naming
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D100",   # a module docstring that restates the filename is worse than none
    "D104",   # ... and the same goes for packages
    "D105",   # magic methods need no docstring
    "D107",   # __init__ documented in the class docstring
    "D401",   # imperative mood reads badly for accessors returning a value
    "TID252", # intra-package relative imports keep the package relocatable
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",     # tests need no annotations
    "D",       # nor docstrings
    "PLR2004", # magic numbers are fine in assertions
    "S101",    # assert is the point
]

[tool.mypy]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
