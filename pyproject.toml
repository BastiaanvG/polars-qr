[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "polars-qr"
description = "Dense numerical operations for Polars, backed by faer."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords =["polars", "faer", "linear-algebra", "least-squares", "pca"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["polars>=1.43"]
dynamic = ["version"]

# These are what PyPI shows in the sidebar of the project page.
[project.urls]
Homepage = "https://github.com/BastiaanvG/polars-qr"
Documentation = "https://bastiaanvg.github.io/polars-qr/"
Repository = "https://github.com/BastiaanvG/polars-qr"
Issues = "https://github.com/BastiaanvG/polars-qr/issues"

[tool.maturin]
python-source = "python"
module-name = "polars_qr._internal"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    { include-group = "build" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
]
# Nothing can be imported until the extension is built, so the tool that builds it is a
# dependency of running the tests and not only of publishing.
build = ["maturin>=1.9,<2"]
lint = ["mypy>=1.18", "ruff>=0.14"]
test = ["numpy>=2.3", "pytest>=8.4"]
docs = [
    # MkDocs 2.0 drops the plugin system with no migration path, which would take
    # mkdocstrings and the Material theme with it.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    # Publishes each version into its own directory on the pages branch, and writes the
    # versions.json the theme's switcher reads.
    "mike>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tests", "examples"]
# These pages hold nothing but a snippet directive inside a ```python fence. The formatter
# reads it as Python, and `--8<--` is a valid expression, so it comes back out spaced as
# `--8 < --` and the page then renders with the example missing.
extend-exclude = ["docs/examples"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "EM",    # flake8-errmsg
    "ERA",   # eradicate (commented-out code)
    "F",     # pyflakes
    "FBT",   # flake8-boolean-trap
    "I",     # isort
    "N",     # pep8-naming
    "PERF",  # perflint
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "TRY",   # tryceratops
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "D100",   # a module docstring that restates the filename is worse than none
    "D104",   # ... and the same goes for packages
    "D105",   # magic methods need no docstring
    "D107",   # __init__ documented in the class docstring
    "D401",   # imperative mood reads badly for accessors returning a value
    "TID252", # intra-package relative imports keep the package relocatable
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
# The operations take their options as keyword arguments, and there are more than five of
# them once weighting, the solver and the null policy are all spelled out.
max-args = 10

[tool.ruff.lint.per-file-ignores]
"examples/**" = [
    "D",       # examples read as scripts, not API surface
    "INP",     # nor are they an importable package
    "T20",     # examples print their results
]
"tests/**" = [
    "FBT",     # a reference implementation mirrors the signature it is checked against
    "ANN",     # tests need no annotations
    "D",       # nor docstrings
    "PLR2004", # magic numbers are fine in assertions
    "S101",    # assert is the point
]

[tool.mypy]
files = ["python", "tests", "examples"]
# The package lives under `python/`, and the tests are not a package at all; both need a
# base directory before mypy can name their modules.
mypy_path = "python"
explicit_package_bases = true
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*"]
disallow_untyped_calls = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[[tool.mypy.overrides]]
# The reference implementations are imported by the tests the way pytest puts them on the
# path, which is not a package mypy can follow.
module = ["reference"]
ignore_missing_imports = true
